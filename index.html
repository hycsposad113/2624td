<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>2624TD 生活板</title>
<meta name="description" content="2624TD 的家事輪值、行事曆、消耗品與雜費紀錄。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a4512f'/%3E%3Cpath d='M8 16 16 9l8 7v8H8z' fill='%23fffcf7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <h1>2624TD 生活板</h1>
    <p class="muted">輸入大家共用的密碼就能進入。</p>
    <div class="field">
      <label for="gatePw"><span class="field-label">共用密碼</span></label>
      <input id="gatePw" type="password" autocomplete="current-password" required>
    </div>
    <p id="gateError" class="form-error" role="alert" hidden></p>
    <button class="btn primary block" type="submit">進入</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>2624TD 生活板</h1>
    </div>
    <div class="top-side">
      <span id="saving" class="saving" role="status" hidden>儲存中</span>
      <button id="logout" class="btn ghost small" type="button">登出</button>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden>示範模式：還沒連上試算表，下面都是範例資料，只存在這台瀏覽器。</div>

  <nav class="tabs" role="tablist" aria-label="功能頁籤">
    <button role="tab" type="button" data-tab="duty" aria-selected="true">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>家事</span>
    </button>
    <button role="tab" type="button" data-tab="calendar" aria-selected="false" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>行事曆</span>
    </button>
    <button role="tab" type="button" data-tab="consumables" aria-selected="false" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>消耗品</span>
    </button>
    <button role="tab" type="button" data-tab="utilities" aria-selected="false" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7z"/></svg><span>雜費</span>
    </button>
    <button role="tab" type="button" data-tab="settle" aria-selected="false" tabindex="-1">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>結算</span>
    </button>
  </nav>

  <main>
    <section id="tab-duty" class="panel" role="tabpanel" aria-label="家事"></section>
    <section id="tab-calendar" class="panel" role="tabpanel" aria-label="行事曆" hidden></section>
    <section id="tab-consumables" class="panel" role="tabpanel" aria-label="消耗品" hidden></section>
    <section id="tab-utilities" class="panel" role="tabpanel" aria-label="雜費" hidden></section>
    <section id="tab-settle" class="panel" role="tabpanel" aria-label="結算" hidden></section>
  </main>

  <footer class="foot muted small">房租不在這裡記錄，直接交給 Jerry。</footer>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
